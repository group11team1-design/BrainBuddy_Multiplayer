databases:
  - name: brainbuddy-db
    databaseName: brainbuddy
    user: brainbuddy
    plan: free

services:
  - type: web
    name: brainbuddy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 100 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brainbuddy-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.8
